version: '3.3'

services:
  browser:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser-simple
    container_name: isolated-browser-simple
    restart: unless-stopped
    ports:
      - "127.0.0.1:5900:5900"   # Simple browser VNC
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISPLAY=:1
    volumes:
      - /tmp/clipboard-sync:/tmp/clipboard-sync:rw
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '(Xvfb|x11vnc|fluxbox)' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  browserx:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser-desktop
    container_name: isolated-browser-desktop
    restart: unless-stopped
    ports:
      - "127.0.0.1:5901:5901"   # Desktop browser VNC
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISPLAY=:2
      - HOME=/home/browser
      - USER=browser
    volumes:
      - browser_data:/home/browser
      - ./transfer:/home/browser/transfer:rw
      - /tmp/clipboard-sync:/tmp/clipboard-sync:rw
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s xdpyinfo -display :2 >/dev/null 2>&1 && echo 'X server healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'


networks:
  isolated-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: isolated-br0
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  browser_data:
