version: '3.3'

services:
  python-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python
    container_name: python-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  node-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.node
    container_name: node-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:4200:4200"
      - "127.0.0.1:8081:8080"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  multi-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.multi
    container_name: multi-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:3002:3000"
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:5001:5000"
      - "127.0.0.1:4201:4200"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  browser:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser-simple
    container_name: isolated-browser-simple
    restart: unless-stopped
    ports:
      - "127.0.0.1:5900:5900"   # Simple browser VNC
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISPLAY=:1
    volumes:
      - /tmp/clipboard-sync:/tmp/clipboard-sync:rw
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '(Xvfb|x11vnc|fluxbox)' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  browserx:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser-desktop
    container_name: isolated-browser-desktop
    restart: unless-stopped
    ports:
      - "127.0.0.1:5901:5901"   # Desktop browser VNC
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISPLAY=:2
      - HOME=/home/browser
      - USER=browser
    volumes:
      - browser_data:/home/browser
      - ./transfer:/home/browser/transfer:rw
      - /tmp/clipboard-sync:/tmp/clipboard-sync:rw
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s xdpyinfo -display :2 >/dev/null 2>&1 && echo 'X server healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'


networks:
  isolated-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: isolated-br0
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  node_modules_cache:
  pip_cache:
  browser_data:
