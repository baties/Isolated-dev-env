version: '3.3'

services:
  python-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.python
    container_name: python-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  node-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.node
    container_name: node-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:4200:4200"
      - "127.0.0.1:8081:8080"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  multi-env:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.multi
    container_name: multi-test-env
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./projects:/workspace/projects
      - ./shared:/workspace/shared
    ports:
      - "127.0.0.1:3002:3000"
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:5001:5000"
      - "127.0.0.1:4201:4200"
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  browser:
      build:
        context: .
        # dockerfile: dockerfiles/Dockerfile.browser  # Use the isolated version
        dockerfile: dockerfiles/Dockerfile.browser-simple  # Use the simple version
      container_name: isolated-browser
      restart: unless-stopped
      ports:
        - "127.0.0.1:5900:5900"   # VNC access
      networks:
        - isolated-network
      stdin_open: true
      tty: true
      security_opt:
        - no-new-privileges:true
      environment:
        - DISPLAY=:0

  browserx:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.browser-desktop
    container_name: isolated-browser-desktop
    restart: unless-stopped
    ports:
      - "127.0.0.1:5901:5901"   # VNC access
    networks:
      - isolated-network
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      - DISPLAY=:0
      - HOME=/home/browser
      - USER=browser
    volumes:
      - browser_data:/home/browser
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '(Xvfb|x11vnc|xfce4-session)' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


networks:
  isolated-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: isolated-br0
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  node_modules_cache:
  pip_cache:
  browser_data:
